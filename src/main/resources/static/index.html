<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Java Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Welcome to My Java Web Application</h1>
        <p>This webpage is running using Java and Spring Boot.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello! Your Java web application is working.";
        }
    </script>

</body>
</html>
